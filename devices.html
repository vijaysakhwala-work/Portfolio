<!doctype html>
<!-- Dev-only page (not part of the build): npm run dev, then open /devices.html
     Shows one route at several real device widths so media queries behave exactly as on those devices. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Device preview</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, "Segoe UI", sans-serif; }
  body { margin: 0; background: #e9ecf3; color: #0b1640; }
  @media (prefers-color-scheme: dark) { body { background: #0b1020; color: #eaf0ff; } }
  header { position: sticky; left: 0; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; padding: .7rem 1rem; background: rgba(255, 255, 255, .92); border-bottom: 1px solid #c9d0e4; color: #0b1640; }
  @media (prefers-color-scheme: dark) { header { background: rgba(11, 16, 32, .94); border-color: #26325a; color: #eaf0ff; } }
  input, select, button { font: inherit; padding: .4rem .6rem; border-radius: .4rem; border: 1px solid #99a3c4; background: #fff; color: #0b1640; }
  input[type=text] { width: 22rem; max-width: 100%; }
  label { display: inline-flex; gap: .35rem; align-items: center; font-size: .9rem; }
  .row { display: flex; gap: 1.2rem; align-items: flex-start; padding: 1rem; overflow-x: auto; }
  figure { flex: none; margin: 0; }
  figcaption { margin: 0 0 .4rem; font: 600 .85rem ui-monospace, Menlo, Consolas, monospace; }
  iframe { display: block; border: 1px solid #8f9ac0; border-radius: .6rem; background: #fff; }
  .hint { font-size: .85rem; opacity: .75; }
</style>
</head>
<body>
<header>
  <strong>Device preview</strong>
  <input id="path" type="text" list="routes" value="/services/ai" aria-label="Route to preview" spellcheck="false">
  <datalist id="routes">
    <option value="/"><option value="/services"><option value="/services/web"><option value="/services/ai"><option value="/services/design"><option value="/services/qa">
    <option value="/services/web/business-websites"><option value="/services/ai/ai-assistants"><option value="/services/ecommerce/shopify-development">
    <option value="/blog"><option value="/blog/core-web-vitals-for-business-websites"><option value="/industries"><option value="/work"><option value="/about"><option value="/contact">
  </datalist>
  <button id="go" type="button">Load</button>
  <label>Height <select id="h"><option value="700">700</option><option value="900" selected>900</option><option value="1200">1200</option></select></label>
  <span class="hint">Tip: open the menu inside a frame to check it at that width. Widths are real CSS pixels.</span>
</header>
<div class="row" id="row"></div>
<script>
  const WIDTHS = [[320, 'small phone'], [390, 'phone'], [768, 'tablet'], [1024, 'small laptop / tablet landscape'], [1280, 'laptop'], [1536, 'desktop']];
  const row = document.getElementById('row'), path = document.getElementById('path'), h = document.getElementById('h');
  function render() {
    const p = path.value.trim() || '/';
    history.replaceState(null, '', '?p=' + encodeURIComponent(p));
    row.textContent = '';
    for (const [w, label] of WIDTHS) {
      const fig = document.createElement('figure'), cap = document.createElement('figcaption'), f = document.createElement('iframe');
      cap.textContent = w + ' px, ' + label; f.src = p; f.width = w; f.height = h.value; f.title = p + ' at ' + w + 'px'; f.loading = 'lazy';
      fig.append(cap, f); row.append(fig);
    }
  }
  const q = new URLSearchParams(location.search).get('p'); if (q) path.value = q;
  document.getElementById('go').addEventListener('click', render); h.addEventListener('change', render);
  path.addEventListener('keydown', e => { if (e.key === 'Enter') render(); });
  render();
</script>
</body>
</html>
